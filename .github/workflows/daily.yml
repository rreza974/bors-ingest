name: Daily Ingest (13:00 Tehran)

on:
  schedule:
    - cron: '30 9 * * *'   # 09:30 UTC = 13:00 Tehran
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run
        env:
          TOKEN: ${{ secrets.TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python daily_ingest_1300.py
