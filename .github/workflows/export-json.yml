name: Export JSON to gh-pages

on:
  workflow_dispatch:
  schedule:
    - cron: '45 9 * * 0-3,6'   # 09:45 UTC ≙ 13:15 تهران (شنبه تا چهارشنبه)

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pymongo

      - name: Export JSON from MongoDB
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python - <<'PY'
          import os, json
          from pymongo import MongoClient

          uri = os.getenv("MONGO_URI")
          client = MongoClient(uri)
          col = client["bors"]["daily_50cols"]

          # نمادهای نمونه؛ هر وقت خواستی این لیست را زیاد کن
          symbols = ["فولاد", "آباد", "کگل"]

          last_n = 400  # آخرین ۴۰۰ روز کاری
          os.makedirs("export/data", exist_ok=True)

          for s in symbols:
            cur = col.find({"نماد": s}, {
              "_id": 0, "تاریخ": 1, "اولین قیمت": 1, "بیشترین قیمت": 1, "کمترین قیمت": 1,
              "قیمت پایانی": 1, "حجم": 1, "قدرت خرید": 1, "ورود پول (تومان)": 1, "ارزش معاملات (تومان)": 1
            }).sort("تاریخ", 1)  # صعودی
            data = list(cur)
            if last_n:
              data = data[-last_n:]

            # تبدیل به فرمت سبک برای HTML: d,o,h,l,c,v,pwr,inflow,tval
            out = []
            for r in data:
              out.append({
                "d": r.get("تاریخ"),
                "o": r.get("اولین قیمت"),
                "h": r.get("بیشترین قیمت"),
                "l": r.get("کمترین قیمت"),
                "c": r.get("قیمت پایانی"),
                "v": r.get("حجم"),
                "pwr": r.get("قدرت خرید"),
                "inflow": r.get("ورود پول (تومان)"),
                "tval": r.get("ارزش معاملات (تومان)")
              })

            with open(f"export/data/{s}.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)

          # README برای نگهداشت
          os.makedirs("export/data", exist_ok=True)
          with open("export/data/README.md", "w", encoding="utf-8") as f:
            f.write("Daily JSON feeds generated by GitHub Actions.\n")

          client.close()
          PY

      - name: Commit to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout gh-pages
          mkdir -p data
          cp -r export/data/* data/

          git add data
          git commit -m "chore(data): update JSON feeds" || echo "No changes to commit"
          git push origin gh-pages
