name: Daily Ingest (13:00 Tehran)

on:
  schedule:
    - cron: '30 9 * * *'   # 09:30 UTC = 13:00 Tehran
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run (with retry)
        env:
          TOKEN: ${{ secrets.TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python runner.py

      - name: Verify write (count today in Tehran)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pymongo import MongoClient
          tehran = timezone(timedelta(hours=3, minutes=30))
          today = datetime.now(tehran).strftime("%Y-%m-%d")
          client = MongoClient("${{ secrets.MONGO_URI }}")
          col = client["bors"]["daily_50cols"]
          cnt = col.count_documents({"تاریخ": today})
          print(f"Tehran today = {today} | inserted docs = {cnt}")
          client.close()
          PY
